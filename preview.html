<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mojo Icons</title>
<style>
  :root {
    --bg: #f7f4ec; --card: #ffffff; --ink: #14181f; --muted: #6b6f78; --line: #e6e1d4; --grid: rgba(20,24,31,.07); --key: rgba(242,163,27,.45);
    --mojo-accent: currentColor;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #101318; --card: #181c23; --ink: #eef0f3; --muted: #9aa1ad; --line: #2a303a; --grid: rgba(255,255,255,.07); --key: rgba(242,163,27,.4);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101318; --card: #181c23; --ink: #eef0f3; --muted: #9aa1ad; --line: #2a303a; --grid: rgba(255,255,255,.07); --key: rgba(242,163,27,.4);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
  h1 small { color: var(--muted); font-weight: 500; margin-left: 6px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
  input[type=search] { font: inherit; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); width: 200px; max-width: 100%; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
  .seg button { font: inherit; font-size: 12.5px; border: 0; background: transparent; color: var(--ink); padding: 6px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.15); }
  main { padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .sizes { display: flex; align-items: flex-end; gap: 14px; height: 26px; color: var(--ink); }
  .sizes svg { display: block; }
  .name { font-size: 12px; font-weight: 600; text-align: center; overflow-wrap: anywhere; }
  .alias { font-size: 10.5px; color: var(--muted); text-align: center; overflow-wrap: anywhere; }
  .big .grid { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
  .big .sizes { height: auto; }
  .stage { position: relative; width: 96px; height: 96px; }
  .stage svg { position: absolute; inset: 0; }
  .s16 .grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .s16 .card { padding: 10px 4px 6px; gap: 5px; }
  .count { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  @media (max-width: 560px) { .controls { margin-left: 0; } input[type=search] { width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>Mojo Icons <small>407 icons · @axismojo/icons</small></h1>
  <div class="controls">
    <input type="search" id="q" placeholder="Search by name" aria-label="Search icons by name">
    <div class="seg" id="accent" role="group" aria-label="Accent colour"></div>
    <div class="seg" id="theme" role="group" aria-label="Theme">
      <button data-v="light">Light</button><button data-v="dark">Dark</button>
    </div>
    <div class="seg" id="weight" role="group" aria-label="Stroke width">
      <button data-v="1.5">1.5</button><button data-v="2">2</button><button data-v="2.5">2.5</button>
    </div>
    <div class="seg" id="view" role="group" aria-label="View">
      <button data-v="sheet">16 · 20 · 24</button><button data-v="s16">16 only</button><button data-v="big">Keylines</button>
    </div>
  </div>
</header>
<main>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</main>

const ACCENTS = [
  { id: 'mono', label: 'Mono', color: 'currentColor' },
  { id: 'aula', label: 'Aula Melo', color: '#f58220' },
  { id: 'uttaroha', label: 'Uttarōha', color: '#ffb454' },
  { id: 'access', label: 'Access Meru', color: '#e0a526' },
  { id: 'axis', label: 'Axis Mojo', color: '#f2a31b' },
];
const params = new URLSearchParams(location.search);
const state = {
  q: params.get('q') || '',
  accent: params.get('accent') || 'mono',
  theme: params.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
  weight: params.get('weight') || '2',
  view: params.get('view') || 'sheet',
  from: params.has('from') ? +params.get('from') : 0,
  to: params.has('to') ? +params.get('to') : Infinity,
};
const accentBox = document.getElementById('accent');
accentBox.innerHTML = ACCENTS.map(a => `<button data-v="${a.id}"><span class="sw" style="background:${a.color === 'currentColor' ? 'var(--ink)' : a.color}"></span>${a.label}</button>`).join('');
const svg = (i, size, sw) => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${i.s}</svg>`;
const keylines = () => {
  let g = '';
  for (let k = 0; k <= 24; k++) g += `<path d="M${k} 0v24M0 ${k}h24" stroke="var(--grid)" stroke-width=".06"/>`;
  return `<svg width="96" height="96" viewBox="0 0 24 24" fill="none" aria-hidden="true">${g}<rect x="2" y="2" width="20" height="20" stroke="var(--key)" stroke-width=".08" stroke-dasharray=".4 .3"/><circle cx="12" cy="12" r="10" stroke="var(--key)" stroke-width=".06"/><rect x="3" y="3" width="18" height="18" rx="4" stroke="var(--key)" stroke-width=".06"/></svg>`;
};
function render() {
  const root = document.documentElement;
  root.dataset.theme = state.theme;
  const acc = ACCENTS.find(a => a.id === state.accent) || ACCENTS[0];
  root.style.setProperty('--mojo-accent', acc.color);
  document.body.className = state.view === 'big' ? 'big' : state.view === 's16' ? 's16' : '';
  for (const [id, key] of [['accent', 'accent'], ['theme', 'theme'], ['weight', 'weight'], ['view', 'view']])
    for (const b of document.querySelectorAll(`#${id} button`)) b.setAttribute('aria-pressed', String(b.dataset.v === state[key]));
  const q = state.q.trim().toLowerCase().replace(/[\s-]/g, '');
  let list = ICONS.filter(i => !q || i.n.toLowerCase().includes(q) || i.a.some(a => a.toLowerCase().includes(q)));
  if (params.has('names')) { const want = params.get('names').split(','); list = want.map(n => ICONS.find(i => i.n === n)).filter(Boolean); }
  list = list.slice(state.from, state.to);
  document.getElementById('count').textContent = `${list.length} of ${ICONS.length} icons`;
  const sw = state.weight;
  document.getElementById('grid').innerHTML = list.map(i => {
    const body = state.view === 'big'
      ? `<div class="stage">${keylines()}${svg(i, 96, sw)}</div>`
      : state.view === 's16' ? svg(i, 16, sw)
      : [16, 20, 24].map(s => svg(i, s, sw)).join('');
    return `<div class="card" title="${i.n}"><div class="sizes">${body}</div><div class="name">${i.n}</div>${i.a.length ? `<div class="alias">${i.a.join(', ')}</div>` : ''}</div>`;
  }).join('');
}
for (const id of ['accent', 'theme', 'weight', 'view'])
  document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state[id] = b.dataset.v; render();
  });
const qi = document.getElementById('q');
qi.value = state.q;
qi.addEventListener('input', () => { state.q = qi.value; render(); });
if (params.has('static')) document.querySelector('header').style.position = 'static';
render();
</script>
