# Every pull request: the icons follow the Mojo style rules, the package builds, and a release note is present.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # the generated src/ must be committed as built from svg/
      - run: git diff --exit-code -- src manifest.json
      - if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: npx changeset status --since=origin/main
