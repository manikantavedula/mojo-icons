# Releases to npm with changesets. Run it by hand from main (Actions → Release → Run workflow): with pending
# changesets it opens (or updates) the "Version Packages" pull request; merge that, then run it again to publish.
name: Release

# Runs only by hand (Actions → this workflow → Run workflow), to save the account's Actions minutes. Checks run
# on the laptop before pushing: scripts/ship.sh.
on:
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # trusted publishing (OIDC, no npm token to store or renew) needs npm 11.5.1 or later; Node 22 ships npm 10
      - run: npm install -g npm@11.21.1
      - run: npm ci
      # changesets/action v2: inputs are kebab-case and renamed, and the GitHub token is an input. npm is authenticated
      # by trusted publishing: npmjs.com trusts this repository's release.yml, and the job's id-token permission lets
      # npm prove it is this workflow. No NPM_TOKEN secret is used (npm removes token publishing in January 2027).
      - uses: changesets/action@v2
        with:
          version-script: npx changeset version
          publish-script: npm run release
          pr-title: Version Packages
          commit-message: Version Packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
