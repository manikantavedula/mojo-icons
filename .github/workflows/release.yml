# On main: if there are pending changesets, open (or update) the "Version Packages" pull request; when that pull
# request is merged, publish the new version to npm.
name: Release

on:
  push:
    branches: [main]
  # run it again by hand (Actions → Release → Run workflow), e.g. after adding the NPM_TOKEN secret
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # changesets/action v2: inputs are kebab-case and renamed, the GitHub token is an input, and npm is authenticated
      # by setup-node's registry-url above (the .npmrc it writes reads NODE_AUTH_TOKEN)
      - uses: changesets/action@v2
        with:
          version-script: npx changeset version
          publish-script: npm run release
          pr-title: Version Packages
          commit-message: Version Packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
