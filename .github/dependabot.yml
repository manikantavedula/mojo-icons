# Monthly dependency updates, grouped into one pull request per ecosystem, to keep the account's Actions minutes for
# real work. Check an update on the laptop (scripts/ship.sh) before merging it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
